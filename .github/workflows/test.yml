name: Test



on:
  schedule:
    - cron: 59 6 * * *
  workflow_dispatch:
    inputs:
      donotpublish:
        description: '构建后不提交发布新版'
        required: false
        type: boolean

# 发布 Release 需要 contents:write；clean 清理 runs 需要 actions:write
permissions:
  contents: write
  actions: write

jobs:
  build:
    needs: telegram-bot-api
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build Tag
        run: |
          # 源码已内化到本仓库（takagen99/Box @ 258a5fe），固定按构建时间打 tag
          echo "tag=$(date +'%Y%m%d-%H%M')" >> $GITHUB_ENV
      - name: Extra Modify
        run: |
          echo '修改VersionName'
          sed -i 's/\.concat(buildTime())/ +"${{ env.tag }}"/g' app/build.gradle
          sed -i "/android:text=/s#=\"#=\"${{ env.tag }}\\\\n\\\\n#" app/src/main/res/layout/dialog_about.xml
          echo 'crosswalk源，防挂'
          if grep -q 'crosswalk' build.gradle; then
            sed -i "/crosswalk/a\        maven { url 'https://j4uq.github.io/crosswalk/releases/crosswalk/android/maven2' }" build.gradle
          else
            sed -i "/jitpack.io/a\        maven { url 'https://j4uq.github.io/crosswalk/releases/crosswalk/android/maven2' }" build.gradle
          fi
      - name: Compress Source
        run: |
          # hin2n 已作为内置 library 模块随主工程编译，源码必须打入源码包
          tar -cJf sourceCode-${{ env.tag }}.tar.xz --exclude=.git --exclude=.github --exclude=docs app hin2n pyramid quickjs xwalk gradle build.gradle gradle.properties settings.gradle gradlew gradlew.bat LICENSE .gitignore

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.8'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install lxml ujson pyquery requests jsonpath cachetools pycryptodome beautifulsoup4

      - name: Modify pyramid——build.gradle
        run: |
          # 替换Windows路径为系统Python路径
          sed -i '/buildPython.*python.exe/d' pyramid/build.gradle
          # pyquery 2.1.0 声明了并不存在的 cssselect>=1.5.0，Chaquopy 解析会失败；
          # 固定到 2.0.2（TVBoxOS 本身即 2.0.2），对已锁版本的仓库无影响。
          sed -i 's/install "pyquery"/install "pyquery==2.0.2"/g' pyramid/build.gradle

      - name: Setup Python local.properties
        run: echo "" > local.properties

      - name: Release Apk Sign
        run: |
          signingConfigs=''
          signingConfig='ICAgICAgICAgICAgaWYgKHByb2plY3QuaGFzUHJvcGVydHkoIlJFTEVBU0VfU1RPUkVfRklMRSIpKSB7XAogICAgICAgICAgICAgICAgc2lnbmluZ0NvbmZpZyBzaWduaW5nQ29uZmlncy5teUNvbmZpZ1wKICAgICAgICAgICAgfVwK'
          signingConfigs="$(echo "$signingConfigs" |base64 -d )"
          signingConfig="$(echo "$signingConfig" |base64 -d )"
          sed -i -e "/defaultConfig {/i\\$signingConfigs " -e "/debug {/a\\$signingConfig " -e "/release {/a\\$signingConfig " app/build.gradle
          cp -f ${{ github.workspace }}/.github/workflows/TVBoxOSC.jks app/TVBoxOSC.jks
          # 独立 hin2n App 模块的签名密钥（其 build.gradle 以 RELEASE_STORE_FILE 属性守卫，路径相对模块目录解析）
          cp -f ${{ github.workspace }}/.github/workflows/TVBoxOSC.jks hin2n/Hin2n_android/app/TVBoxOSC.jks
          sed -i '$a\RELEASE_STORE_FILE=./TVBoxOSC.jks'     ./gradle.properties
          sed -i '$a\RELEASE_KEY_ALIAS=TVBoxOSC'            ./gradle.properties
          sed -i '$a\RELEASE_STORE_PASSWORD=TVBoxOSC'       ./gradle.properties
          sed -i '$a\RELEASE_KEY_PASSWORD=TVBoxOSC'         ./gradle.properties
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Install NDK and CMake
        run: |
          # hin2n 内置模块通过 CMake 编译 n2n C 源码：安装与模块 build.gradle 一致的 NDK r25b 与 CMake 3.22.1
          # sdkmanager 在新版 JDK 下才能正常启动，故本步骤放在 setup-java 17 之后
          set -e
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "ndk;25.2.9519653" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v6.2.0
      - name: Build With Gradle
        run: |
          chmod +x gradlew
          # 输出 tee 落盘，失败时把真正的编译错误行直接打在日志尾部，便于一眼看到
          set +e
          ./gradlew assemblerelease --build-cache --parallel --daemon --warning-mode all 2>&1 | tee gradle.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "===== 编译错误行（error: / e: ）====="
            grep -nE "error:|^e: |Execution failed for task" gradle.log | tail -n 60 || true
            exit "$rc"
          fi
      - name: Prepare App
        run: |
          rm -rf apk/
          mkdir -p apk/
          for file in `find ~ -name "*release*.apk" -print`; do
            base=$(basename "$file")
            if [[ "$file" == *Hin2n_android* ]]; then
              # 独立 hin2n 组网 App：单独命名，避免落入下方通用分支被覆盖
              new_base="hin2n_${{ env.tag }}.apk"
            elif [[ "$base" == TVBox_* ]]; then
              new_base=$(echo "$base" | sed "s/release/takagen99_${{ env.tag }}/")
            else
              new_base="TVBox_takagen99_${{ env.tag }}.apk"
            fi
            mv "$file" "apk/$new_base"
          done
          mv sourceCode-${{ env.tag }}.* apk/
      - name: Release Note
        run: |
          export LESSCHARSET=utf-8
          echo -e "Credit: [takagen99](https://github.com/takagen99/Box)\nBase: 258a5fef61578869ae905ca230bdde9e99fc19a8\nBuild: ${{ env.tag }}\nChanges:\n\`\`\`" > apk/takagen99-Release.log
          git log --pretty=format:%B -10 | sed -e "/^Merge \(pull\|branch\|remote\)/d" -e '/^$/d' >> apk/takagen99-Release.log
          echo -e '\n```' >> apk/takagen99-Release.log
      - name: Upload App To Artifact
        uses: actions/upload-artifact@v7
        with:
          name: takagen99-Box
          path: |
            apk/*
      - name: Whether Or Not to Publish
        if: ${{ inputs.donotpublish }}
        run: |
          echo "skip publish"
          echo "tag=" >> $GITHUB_ENV
      - name: Release and Upload Assets
        uses: ncipollo/release-action@v1
        if: ${{ env.tag }}
        with:
          name: ${{ env.tag }}
          tag: ${{ env.tag }}
          bodyFile: apk/takagen99-Release.log
          allowUpdates: true
          removeArtifacts: true
          artifacts: |
            apk/*.apk
            apk/sourceCode-${{ env.tag }}.*
      - name: Download Telegram Bot API Binary
        if: ${{ env.tag }}
        uses: actions/download-artifact@v8
        with:
          name: telegram-bot-api-binary
      - name: Post To Telegram
        if: ${{ env.tag }}
        env:
          CHAT_ID: -1001734684817
          TELEGRAM_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          if [ -n "${{ secrets.BOT_TOKEN }}" ]; then
            sed -i -e '1s/\[\(.*\)\].*/#\1/' -e 's#\([&"\/]\)#\\\1#g' apk/takagen99-Release.log
            mv -f apk/takagen99-Release.log caption.txt
            chmod +x telegram-bot-api-binary
            ./telegram-bot-api-binary --api-id=21724 --api-hash=3e0cb5efcd52300aec5994fdfc5bdc16 --local 2>&1 > /dev/null &
            mv .github/scripts/upload.py ./
            python upload.py
          fi

  telegram-bot-api:
    name: Telegram Bot API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Clone Telegram Bot API
        run: |
          git clone --recursive https://github.com/tdlib/telegram-bot-api.git
          git status telegram-bot-api >> telegram-bot-api-status

      - name: Cache Bot API Binary
        id: cache-bot-api
        uses: actions/cache@v6
        with:
          path: telegram-bot-api-binary
          key: CI-telegram-bot-api-${{ hashFiles('telegram-bot-api-status') }}

      - name: Compile Telegram Bot API
        if: steps.cache-bot-api.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install make git zlib1g-dev libssl-dev gperf cmake g++
          cd telegram-bot-api
          rm -rf build
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX:PATH=.. ..
          cmake --build . --target install -j$(nproc)
          cd ../..
          ls -l telegram-bot-api/bin/telegram-bot-api*
          cp telegram-bot-api/bin/telegram-bot-api telegram-bot-api-binary

      - name: Upload Binary
        uses: actions/upload-artifact@v7
        with:
          name: telegram-bot-api-binary
          path: telegram-bot-api-binary

  clean:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Delete older workflow runs and artifacts
        uses: Mattraks/delete-workflow-runs@main
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 14
          keep_minimum_runs: 10
