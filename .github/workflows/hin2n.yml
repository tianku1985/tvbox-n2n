# 已停用：hin2n 不再作为独立 App 构建/发布。
#
# 自 2026-10 起，hin2n 已改造为 TVBox 的内置 library 模块（settings.gradle 的 :hin2n，
# 源码位于 hin2n/Hin2n_android/app），其 native 代码随主工程 Test 工作流一起 CMake 编译，
# 产物就是 TVBox APK 本身，首页「组网」入口打开内置管理页。
#
# 保留本文件仅为说明；即使手动触发也只会输出提示并成功退出，不会再产出独立 APK。
name: hin2n (disabled)

on:
  workflow_dispatch:

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Explain
        run: |
          echo "hin2n 已内置于 TVBox，不再单独打包。"
          echo "请运行 Test 工作流构建 TVBox APK（首页-组网 即 hin2n 管理页）。"
