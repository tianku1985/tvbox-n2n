// hin2n 已模块化：作为 TVBox 的 :hin2n library 被 :app 依赖，
// 不再独立产出 APK（无 applicationId / 签名 / flavor / greendao 插件）。
// DAO 代码早已 greenDAO 生成并实体化在 src/main/java 下，只需 greendao 运行时依赖。
apply plugin: 'com.android.library'

android {
    namespace 'wang.switchy.hin2n'
    compileSdkVersion 34
    // 固定 NDK 版本，保证本地与 GitHub Actions（sdkmanager 安装同名版本）构建一致
    ndkVersion '25.2.9519653'

    defaultConfig {
        minSdkVersion 19
        targetSdkVersion 28
        externalNativeBuild {
            cmake {
                cppFlags ""
                cFlags "-D__ANDROID_NDK__"
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // n2n 配置数据库（DAO 类被 :app 直接调用 insert/delete/loadAll/count/update，
    // 这些方法继承自 greenDAO AbstractDao，必须用 api 把 greenDAO 暴露给 :app 的编译 classpath）
    api 'org.greenrobot:greendao:3.2.0'
    // 与主工程一致的 EventBus（:app 也显式 implementation，但 hin2n 的公开 API 会在
    // 参数/返回值里出现 EventBus 事件类型，用 api 保证 :app 编译时类型可解析）
    api 'org.greenrobot:eventbus:3.3.1'
    // N2NService 使用 NotificationCompat；运行时由 :app 提供 appcompat（legacy 变体为 1.6.1）
    compileOnly 'androidx.appcompat:appcompat:1.6.1'
}
