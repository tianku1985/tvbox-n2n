// hin2n 独立组网 App：从 TVBox 内置模块拆分，兼容 Android 4.4+（手机+TV）
apply plugin: 'com.android.application'

android {
    namespace 'wang.switchy.hin2n'
    compileSdkVersion 34
    // 固定 NDK 版本，保证本地与 GitHub Actions（sdkmanager 安装同名版本）构建一致
    ndkVersion '25.2.9519653'

    defaultConfig {
        applicationId "wang.switchy.hin2n"
        minSdkVersion 19
        targetSdkVersion 28
        versionCode 1
        versionName "1.0"
        externalNativeBuild {
            cmake {
                cppFlags ""
                cFlags "-D__ANDROID_NDK__"
            }
        }
    }

    signingConfigs {
        if (project.hasProperty('RELEASE_STORE_FILE')) {
            release {
                storeFile file(System.getenv('RELEASE_STORE_FILE') ?: RELEASE_STORE_FILE)
                storePassword System.getenv('RELEASE_STORE_PASSWORD') ?: RELEASE_STORE_PASSWORD
                keyAlias System.getenv('RELEASE_KEY_ALIAS') ?: RELEASE_KEY_ALIAS
                keyPassword System.getenv('RELEASE_KEY_PASSWORD') ?: RELEASE_KEY_PASSWORD
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            if (project.hasProperty('RELEASE_STORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    // n2n 配置数据库（greenDAO 运行时）
    api 'org.greenrobot:greendao:3.2.0'
    // EventBus（:hin2n 内部事件通信）
    api 'org.greenrobot:eventbus:3.3.1'
    // AppCompat（NotificationCompat、AppCompatActivity、AppCompatCheckBox 等）
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // RecyclerView（配置管理列表）
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
